name: "Penozovi: publish plugin store"

on:
  push:
    paths:
      - "plugins/**"
      - "scripts/build_plugin_store.py"
      - ".github/workflows/plugin-store.yml"
  pull_request:
    paths:
      - "plugins/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate manifests and build index
        run: python3 scripts/build_plugin_store.py
      - name: Upload store index
        uses: actions/upload-artifact@v4
        with:
          name: penozovi-store-index
          path: |
            store/index.json
            app/src/main/assets/penozovi_plugins/store.json
      - name: Commit generated index
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/index.json app/src/main/assets/penozovi_plugins/store.json
          if git diff --cached --quiet; then
            echo "Store index unchanged"
          else
            git commit -m "chore(store): regenerate plugin store index [skip ci]"
            git push
          fi
