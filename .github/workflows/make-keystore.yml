name: "Penozovi: make keystore"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/penozovi.keystore \
            -storetype JKS \
            -alias penozovi \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass Penozovi2026 \
            -keypass Penozovi2026 \
            -dname "CN=Penozovi, OU=Browser, O=Penozovi, C=RU"
          base64 -w0 out/penozovi.keystore > out/penozovi.keystore.base64
      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: penozovi-keystore
          path: out/penozovi.keystore.base64
