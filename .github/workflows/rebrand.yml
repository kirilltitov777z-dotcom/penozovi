name: "Penozovi: rebrand strings"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replace Candy branding
        run: python3 scripts/rebrand_strings.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res
          if git diff --cached --quiet; then
            echo "Nothing to rebrand"
          else
            git commit -m "feat: replace Candy branding across all locales"
            git push
          fi
